<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Thiago Pantoja — Principal Platform Engineer e Cloud Architect">
  <style>
    .bg { fill: #0a0a0a; }
    .grid { stroke: #ffffff; stroke-opacity: .05; }
    .name { font: 700 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e5e2e1; animation: up 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .dot { fill: #f59e0b; animation: pop .6s 1s both; }
    .eyebrow { font: 500 14px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 4px; fill: #9a9a9a; animation: fade 1s .3s both; }
    .role { font: 400 22px ui-monospace, Menlo, Consolas, monospace; fill: #f59e0b; opacity: 0; animation: cycle 20s infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; } .r4 { animation-delay: 12s; } .r5 { animation-delay: 16s; }
    .line { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.4s .8s ease-out forwards; }
    .ring { fill: none; stroke: #f59e0b; stroke-opacity: .35; transform-origin: 1010px 160px; animation: spin 18s linear infinite; }
    .ring2 { stroke-opacity: .15; animation-duration: 28s; animation-direction: reverse; }
    .node { fill: #e5e2e1; transform-origin: 1010px 160px; animation: spin 18s linear infinite; }
    .core { fill: #f59e0b; transform-origin: 1010px 160px; animation: pulse 3s ease-in-out infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.35); opacity: .5; } }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(12px); }
      4%, 18% { opacity: 1; transform: none; }
      22%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .role { opacity: 0; } .r1 { opacity: 1; }
      .line { stroke-dashoffset: 0; }
    }
  </style>

  <rect class="bg" width="1200" height="320" rx="20"/>
  <path class="grid" d="M0 80H1200M0 160H1200M0 240H1200M300 0V320M600 0V320M900 0V320"/>

  <text class="eyebrow" x="72" y="96">PRINCIPAL PLATFORM ENGINEER // CLOUD ARCHITECT</text>
  <text class="name" x="72" y="170">Thiago Pantoja<tspan class="dot">.</tspan></text>
  <line class="line" x1="72" y1="196" x2="332" y2="196"/>

  <text class="role r1" x="72" y="244">› Platform Engineering · GCP · Kubernetes</text>
  <text class="role r2" x="72" y="244">› Cloud Architecture · AWS · Azure · OCI</text>
  <text class="role r3" x="72" y="244">› Terraform · CI/CD · GitOps · IaC</text>
  <text class="role r4" x="72" y="244">› System Design · SRE · FinOps</text>
  <text class="role r5" x="72" y="244">› Software Architecture · Marketing · Motion</text>

  <circle class="ring" cx="1010" cy="160" r="90" stroke-dasharray="6 10"/>
  <circle class="ring ring2" cx="1010" cy="160" r="120" stroke-dasharray="2 14"/>
  <circle class="node" cx="1100" cy="160" r="4"/>
  <circle class="core" cx="1010" cy="160" r="8"/>
</svg>
